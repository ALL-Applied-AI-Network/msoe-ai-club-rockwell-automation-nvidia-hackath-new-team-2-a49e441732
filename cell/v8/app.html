<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>v8 cell console</title>
<style>
  :root { --bg:#111418; --panel:#191d23; --line:#2a2f37; --text:#d7dce2; --dim:#8b939e; --accent:#4c8df5; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text); font:14px/1.45 -apple-system, system-ui, sans-serif;
         display:flex; height:100vh; overflow:hidden; }
  aside { width:400px; min-width:400px; border-right:1px solid var(--line); display:flex;
          flex-direction:column; padding:12px; gap:10px; }
  #top { overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:10px; }
  main { flex:1; } iframe { width:100%; height:100%; border:0; background:#0c0e11; }
  details { border:1px solid var(--line); border-radius:9px; padding:8px 10px; }
  summary { font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase;
            cursor:pointer; user-select:none; }
  summary::marker { color:var(--accent); }
  details[open] summary { margin-bottom:8px; }
  button { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:7px;
           padding:6px 12px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--accent); }
  button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  select, input { background:var(--panel); color:var(--text); border:1px solid var(--line);
                  border-radius:6px; padding:5px 7px; font:inherit; }
  input[type=number] { width:52px; }
  .row { display:flex; gap:6px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .item { display:flex; gap:8px; align-items:center; padding:5px 8px; border:1px solid var(--line);
          border-radius:7px; margin-bottom:5px; justify-content:space-between; }
  .item small, .task small { color:var(--dim); display:block; }
  .task { padding:6px 9px; border:1px solid var(--line); border-radius:7px; margin-bottom:5px; cursor:pointer; }
  .task:hover { border-color:var(--accent); } .task.sel { border-color:var(--accent); background:#1b2537; }
  #status { color:var(--dim); font-size:12px; }
  #log div { color:var(--dim); font-size:12px; padding:2px 0; border-bottom:1px dotted var(--line); }
  #log div.err { color:#e06c75; }
  .muted { color:var(--dim); font-size:12px; }
  #chat { border:1px solid var(--line); border-radius:9px; display:flex; flex-direction:column;
          flex:1 1 0; min-height:180px; }
  #top { flex:0 1 auto; }
  #chatHead { display:flex; justify-content:space-between; align-items:center; padding:8px 10px 0; }
  #chatHead span { font-size:11px; letter-spacing:.08em; color:var(--dim); text-transform:uppercase; }
  #msgs { flex:1; overflow-y:auto; padding:8px 10px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:88%; padding:6px 10px; border-radius:10px; white-space:pre-wrap; }
  .msg.you { align-self:flex-end; background:#1b2537; border:1px solid #27406e; }
  .msg.robot { align-self:flex-start; background:var(--panel); border:1px solid var(--line); }
  .msg.act { align-self:flex-start; background:none; border:none; padding:1px 2px;
             color:var(--dim); font-style:italic; font-size:12.5px; max-width:100%; }
  .msg.err { align-self:flex-start; background:#2a1518; border:1px solid #6e2727; }
  #sayRow { display:flex; gap:6px; padding:8px 10px; border-top:1px solid var(--line); }
  #say { flex:1; }
  #thinking { color:var(--dim); font-size:12px; padding:0 10px 6px; display:none; }
</style>
</head>
<body>
<aside>
  <div id="top">
    <section>
      <div class="row">
        <button id="bSim">Simulator</button>
        <button id="bReal">Real cell</button>
        <button id="bReset">Reset</button>
      </div>
      <div id="status">loading…</div>
    </section>

    <details id="dTasks">
      <summary>Tasks</summary>
      <div id="tasks"></div>
      <div class="muted">click a task: the simulator stages its table and the instruction lands in the chat box - Enter sends it</div>
    </details>

    <details open>
      <summary>On the table</summary>
      <div id="table"><span class="muted">not connected</span></div>
    </details>

    <details open id="dAdd">
      <summary>Add things</summary>
      <div id="rows"></div>
      <div class="row">
        <button id="bPart">+ part</button>
        <button id="bPour">Pour these</button>
      </div>
      <div class="row">
        <select id="boxColor"></select>
        <button id="bBox">Add a box</button>
      </div>
    </details>

    <details open>
      <summary>What it sees</summary>
      <div id="objects"><span class="muted">nothing yet - scan or ask it to look</span></div>
    </details>

    <details>
      <summary>Log</summary>
      <div id="log"></div>
    </details>
  </div>

  <div id="chat">
    <div id="chatHead">
      <span id="chatTitle"><span id="stateDot">●</span> Talk to it <small id="stateText" class="muted"></small></span>
      <button id="bClear">clear</button>
    </div>
    <div id="msgs"></div>
    <div id="thinking">thinking…</div>
    <div id="sayRow">
      <input id="say" placeholder="Say something… (Enter sends)" autocomplete="off">
      <button id="bSay">Send</button>
    </div>
  </div>
</aside>
<main><iframe id="viewer" title="rerun"></iframe></main>

<script>
let S = {kinds:[], boxes:[], colors:[], tasks:[], table:[], log:[], chat:[], mode:null, task:null};
const $ = id => document.getElementById(id);
const post = async (path, body) => {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"},
                               body:JSON.stringify(body||{})});
  await refresh();
  return r;
};

function partRow() {
  const d = document.createElement("div");
  d.className = "row";
  d.innerHTML = `<select class="k">${S.kinds.map(k=>`<option>${k}</option>`).join("")}</select>
    <select class="c">${S.colors.map(c=>`<option>${c}</option>`).join("")}</select>
    <input class="n" type="number" min="1" value="1">
    <button class="x">×</button>`;
  d.querySelector(".x").onclick = () => d.remove();
  $("rows").appendChild(d);
}

function render() {
  $("status").textContent = (S.mode ? `connected: ${S.mode}` : "not connected")
                            + ` · build ${S.build} · mind: ${S.model}`;
  $("bSim").className = S.mode === "sim" ? "on" : "";
  $("bReal").className = S.mode === "real" ? "on" : "";

  $("tasks").innerHTML = S.tasks.map(t =>
    `<div class="task ${t.name===S.task?"sel":""}" data-n="${t.name}">
       <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
         <span>${t.name}<small>${t.instruction}</small></span>
         <button class="run" data-n="${t.name}">Run</button>
       </div></div>`).join("");
  const stage = async (name) => {
    const r = await (await fetch("/task", {method:"POST", headers:{"Content-Type":"application/json"},
                                           body:JSON.stringify({name})})).json();
    await refresh();
    return r.instruction;
  };
  for (const el of $("tasks").querySelectorAll(".task"))
    el.onclick = async () => { const i = await stage(el.dataset.n); if (i) $("say").value = i; };
  for (const b of $("tasks").querySelectorAll(".run"))
    b.onclick = async (ev) => {         // Run = stage the cell, then say the instruction AS Joel
      ev.stopPropagation();
      const i = await stage(b.dataset.n);
      if (i) { $("say").value = i; await sayIt(); }
    };

  if (S.mode === "real") {
    const tr = S.trials || [];
    $("table").innerHTML =
      (S.trials_error ? `<div class="muted">trials: ${S.trials_error}</div>` : "")
      + (tr.length ? tr.map(t => `<div class="item"><span>trial ${t.id} <small>${t.status}</small></span></div>`).join("")
                   : `<span class="muted">no trials listed</span>`)
      + `<div class="row" style="margin-top:6px"><button id="bTrial">Start the ready trial</button></div>`;
    const bt = $("bTrial"); if (bt) bt.onclick = () => post("/trial/start");
  } else {
    $("table").innerHTML = S.table.length ? S.table.map(o =>
      `<div class="item"><span>${o.color} ${o.name||o.kind} <small>(${o.x}, ${o.y})</small></span>
       <span>${o.box?`<button data-a="tip" data-id="${o.id}">tip out</button>`:""}
       <button data-a="take" data-id="${o.id}">take</button></span></div>`).join("")
      : `<span class="muted">${S.mode==="sim"?"nothing on the table":"not connected"}</span>`;
    for (const b of $("table").querySelectorAll("button"))
      b.onclick = () => post("/hands", {action: b.dataset.a, id: +b.dataset.id});
  }

  const obs = S.objects || [];
  $("objects").innerHTML = obs.length ? obs.map(o =>
    `<div class="item" style="cursor:pointer" data-id="${o.id}">
       <span>${o.name} #${o.id} <small>(${o.x}, ${o.y}) · ${o.sx}×${o.sy}, ≤${o.top} tall · ${o.shots} views</small></span>
     </div>`).join("") : `<span class="muted">nothing yet - scan or ask it to look</span>`;
  for (const el of $("objects").querySelectorAll(".item"))
    el.onclick = () => fetch("/flash", {method:"POST", headers:{"Content-Type":"application/json"},
                                        body:JSON.stringify({id:+el.dataset.id})});

  $("log").innerHTML = S.log.slice(-12).reverse().map(l =>
    `<div class="${/Error|couldn|unreachable|refused/.test(l.text)?"err":""}">${l.text}</div>`).join("");

  const crashed = S.chat.length && S.chat[S.chat.length-1].text.startsWith("I CRASHED");
  $("stateDot").style.color = crashed ? "#e06c75" : S.busy ? "#e5c07b" : "#71c178";
  $("stateText").textContent = crashed ? "crashed - see the last message" : S.busy ? "working…" : "waiting for you";

  const m = $("msgs");
  const stick = m.scrollTop + m.clientHeight > m.scrollHeight - 40;
  m.innerHTML = S.chat.map(c => {
    const act = c.who === "robot" && c.text.startsWith("(");
    const err = c.who === "robot" && c.text.startsWith("I CRASHED");
    const cls = err ? "robot err" : act ? "act" : c.who;
    const txt = act ? c.text.replace(/^\(|\)$/g, "") : c.text;
    return `<div class="msg ${cls}">${txt}</div>`;
  }).join("");
  if (stick) m.scrollTop = m.scrollHeight;
}

async function refresh() {
  S = await (await fetch("/state")).json();
  if (!window._viewerSet) { $("viewer").src = S.viewer; window._viewerSet = true; }
  if (!window._rowsSet) {
    $("boxColor").innerHTML = S.colors.map(c=>`<option ${c==="white"?"selected":""}>${c}</option>`).join("");
    window._rowsSet = true; partRow();
  }
  render();
}

async function sayIt() {
  const text = $("say").value.trim();
  if (!text) return;
  $("say").value = "";
  S.chat.push({who:"you", text}); render();
  $("thinking").style.display = "block";
  try { await post("/say", {text}); }
  finally { $("thinking").style.display = "none"; }
}

$("bSim").onclick  = () => post("/connect", {target:"sim"});
$("bReal").onclick = () => post("/connect", {target:"real"});
$("bReset").onclick = () => post("/reset");
$("bPart").onclick = () => partRow();
$("bPour").onclick = () => post("/hands", {action:"pour", items:[...$("rows").children].map(r=>({
  kind:r.querySelector(".k").value, color:r.querySelector(".c").value, count:+r.querySelector(".n").value}))});
$("bBox").onclick = () => post("/hands", {action:"add_box", color:$("boxColor").value});
$("bSay").onclick = sayIt;
$("say").addEventListener("keydown", e => { if (e.key === "Enter") sayIt(); });
$("bClear").onclick = () => post("/chat/clear");

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
