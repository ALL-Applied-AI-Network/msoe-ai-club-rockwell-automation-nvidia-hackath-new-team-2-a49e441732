<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robot</title>
<style>
  :root { --bg: #111317; --panel: #171a20; --line: #2a2f38; --text: #e6e8eb; --dim: #8b93a1; --accent: #2f6feb;
          --robot: #232832; --log: #7d8796; --hands: #d29922; --action: #3fb950; --motion: #c9d1d9; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         display: grid; grid-template-columns: minmax(340px, 420px) 1fr; }
  #side { display: flex; flex-direction: column; border-right: 1px solid var(--line); min-height: 0; height: 100%; }
  .sec { border-bottom: 1px solid var(--line); padding: 10px 12px; flex-shrink: 0; }  /* never squeezed: a squeezed section spilled over the next and ate its clicks */
  details.fold > summary { list-style: none; cursor: pointer; user-select: none; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary h4 { margin: 0; }
  details.fold > summary h4::before { content: "▸"; font-size: 10px; width: 10px; }
  details.fold[open] > summary h4::before { content: "▾"; }
  details.fold[open] > summary { margin-bottom: 6px; }
  .sec h4 { margin: 0 0 6px; font-size: 11px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; }
  .sec h4 .r { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 400; }
  button { background: #262b34; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; font-size: 12px; cursor: pointer; }
  button:hover { border-color: #4a5260; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .big { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #sort { border-color: var(--action); color: #7ee2a0; }
  #streams { border-color: #d9a441; color: #f0c674; }
  .big button { padding: 10px; font-size: 14px; font-weight: 600; }
  #map { border-color: var(--accent); color: #9cc4ff; }
  .top { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .top .state { color: var(--dim); font-size: 12px; margin-left: auto; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: transparent; color: var(--dim); padding: 3px 8px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  select, input[type=number], input[type=text], input[type=password] { background: #20242c; color: var(--text); border: 1px solid var(--line);
         border-radius: 5px; padding: 3px 5px; font: inherit; font-size: 12px; }
  input[type=number] { width: 44px; }
  input[type=text], input[type=password] { flex: 1; min-width: 0; }
  #objs { display: flex; flex-direction: column; gap: 3px; max-height: 150px; overflow-y: auto; }
  .obj { display: flex; gap: 6px; align-items: center; font-size: 12px; }
  .obj span { flex: 1; }
  .obj small { color: var(--dim); }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; border: 1px solid #0006; }
  #cup { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; }
  #actions { flex: 1; min-height: 80px; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 3px;
             font: 12px/1.45 ui-monospace, Menlo, monospace; color: var(--motion); border-bottom: 1px solid var(--line); }
  #actions .a { padding: 2px 0; border-bottom: 1px dashed #222730; white-space: pre-wrap; }
  #actions .a b { color: var(--dim); font-weight: 400; margin-right: 6px; }
  #actions .empty { color: var(--dim); font-family: inherit; }
  #status { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: #151a22; }
  #status .phase { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 10px;
                   background: #2a2f38; color: var(--dim); white-space: nowrap; }
  #status .head { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.looking .phase, #status.planning .phase, #status.working .phase { background: #1f3a66; color: #9cc4ff; }
  #status.rethinking .phase { background: #4d3a12; color: #f2cc60; }
  #status.needs .phase { background: #5c1f1f; color: #ff9b9b; }
  #status.done .phase { background: #1f4d2c; color: #7ee2a0; }
  #convo { max-height: 40vh; overflow-y: auto; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--line); }
  .m { max-width: 90%; padding: 6px 9px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 13px; }
  .you { align-self: flex-end; background: var(--accent); }
  .robot { align-self: flex-start; background: var(--robot); }
  .log, .action, .hands, .system { align-self: stretch; max-width: 100%; padding: 0 2px; font-size: 12px; }
  .log { color: var(--log); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
  .action { color: var(--action); font-style: italic; } .hands { color: var(--hands); } .system { color: var(--dim); text-align: center; }
  #chat { display: flex; gap: 6px; padding: 8px 12px; align-items: center; }
  #chat textarea { flex: 1; resize: none; height: 34px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; font: inherit; }
  #toggle { width: 30px; height: 30px; border-radius: 50%; padding: 0; position: relative; }
  #toggle i { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  #right { position: relative; min-width: 0; }
  #right iframe { width: 100%; height: 100%; border: 0; display: block; background: #0d0f12; }
  #ladder .lt { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; }
  #ladder .lt span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
  #ladder .lt span:hover { color: #fff; }
  #ladder .chip { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: #2a2f38; color: var(--dim); min-width: 44px; text-align: center; }
  #ladder .chip.pass { background: #1f4d2c; color: #7ee2a0; } #ladder .chip.fail { background: #5c1f1f; color: #ff9b9b; }
  #ladder .chip.running { background: #1f3a66; color: #9cc4ff; } #ladder .chip.queued { background: #33302a; color: #c9b27a; }
  #ladder .lt button { padding: 1px 7px; font-size: 11px; }
  #ltasks { display: flex; flex-direction: column; max-height: 260px; overflow-y: auto; }
  #shot { position: absolute; inset: 0; background: #0d0f12f2; overflow: auto; padding: 16px 20px; }
  #shot h3 { margin: 0 0 4px; font-size: 16px; } #shot .ins { color: var(--dim); margin-bottom: 10px; }
  #shot .pics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #shot .pics figure { margin: 0; } #shot img { width: 100%; border-radius: 6px; border: 1px solid var(--line); }
  #shot figcaption { color: var(--dim); font-size: 12px; margin-bottom: 4px; }
  #shot .chk { margin: 10px 0; font-size: 13px; } #shot .chk div { padding: 2px 0; }
  #shot pre { white-space: pre-wrap; font-size: 12px; color: var(--motion); background: var(--panel); padding: 8px; border-radius: 6px; }
  #shot .x { position: absolute; top: 12px; right: 16px; }
</style>
</head>
<body>
<div id="side">
  <div class="sec">
    <div class="top">
      <span class="seg"><button id="m-sim" class="on">Simulator</button><button id="m-real">Real cell</button></span>
      <span class="state" id="state">…</span>
    </div>
    <div class="big"><button id="reset" title="everything from scratch: the table, the robot's map, the viewer, the chat">Reset</button>
      <button id="sort" title="sort the parts into the cups by colour: cups from the table camera, a close look at each part (SAM and depth must agree), then picks">Sort</button></div>
    <div class="big"><button id="datarun" title="no sorting: camera sweeps over the parts, recording wrist pictures at full rate and a full set at every stop (about 2-3 min)">Data run</button>
      <button id="speedtest" title="out and back along a line, 150 mm above the table, at 100 to 500 mm/s: how fast the arm really goes, how late it starts, how long it settles">Speed test</button></div>
  </div>

  <details class="sec fold" id="ladder" open>
    <summary><h4>Task ladder <span class="r" id="lsum"></span></h4></summary>
    <div class="row" style="margin-bottom:6px"><button id="lall">Run all</button><button id="lstop">Stop after this one</button></div>
    <div id="ltasks"></div>
  </details>

  <details class="sec fold" id="scene" open>
    <summary><h4>On the table <span class="r" id="count"></span></h4></summary>
    <div id="objs"></div>
  </details>

  <details class="sec fold" id="add">
    <summary><h4>Add things</h4></summary>
    <div id="cup"></div>
    <div class="row"><button id="addrow">+ part</button><button id="pour">Pour these</button>
      <span style="flex:1"></span><select id="boxcolor"></select><button id="addbox">Add a box</button></div>
  </details>

  <div class="sec" id="realpanel" hidden>
    <h4>Real cell</h4>
    <div class="row" style="margin-bottom:6px"><input type="text" id="url" value="https://hackathon.sidclab.org" title="the cell's address"></div>
    <div class="row" style="margin-bottom:6px"><input type="password" id="token" placeholder="run token (empty: our approved request)"><button id="check">Check setup</button></div>
    <div class="row"><button id="run" disabled>Run the test</button><span style="color:var(--dim);font-size:12px" id="trials">not connected</span></div>
  </div>

  <div id="actions"><div class="empty">The arm's moves show up here: from where to where, how it's turned, how long.</div></div>

  <div id="status" class="waiting"><span class="phase">waiting</span><span class="head">Waiting for a job.</span></div>
  <div id="convo" hidden></div>
  <div id="chat"><textarea id="text" placeholder="Talk to it… (Enter sends)"></textarea>
    <button id="toggle" title="show the conversation">💬<i hidden id="unread"></i></button></div>
</div>
<div id="right"><iframe id="viewer" title="the robot's mind"></iframe><div id="shot" hidden></div></div>
<script>
const KINDS = ["cube_10", "cube_16", "lego_1x2", "lego_2x4", "screw_m6x30", "dowel", "d6", "d4", "d8", "d20", "ring", "jack", "soldier"];
const COLORS = ["red", "yellow", "blue", "green", "orange", "purple", "white", "black", "gray", "steel", "gold", "wood", "olive", "tan"];
const SW = {red:"#c82323",yellow:"#ebc81e",blue:"#2350cd",green:"#2a9d3a",orange:"#e8781e",purple:"#7b3fb5",white:"#eeeeee",
            black:"#222",gray:"#8c8c8c",steel:"#a9adb3",gold:"#d4a72c",wood:"#c8a070",olive:"#6b7b3a",tan:"#d2b48c"};
const DEFAULT_CUP = [["cube_10","red",2],["cube_10","blue",2],["lego_1x2","yellow",2],["screw_m6x30","steel",1]];
const $ = id => document.getElementById(id);
const post = (url, body) => fetch(url, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})}).then(r => r.json());
function opts(sel, list, val) { sel.innerHTML = list.map(x => `<option${x === val ? " selected" : ""}>${x}</option>`).join(""); }
const EMPTY = '<div class="empty">The arm\'s moves show up here: from where to where, how it\'s turned, how long.</div>';

// the stream: moves to the actions panel, the status to its line, everything else to the (folded) conversation
const convo = $("convo"), acts = $("actions");
let nMoves = 0;
function atBottom(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 40; }
function status(s) {
  const b = $("status");
  b.className = (s.phase || "waiting").split(" ")[0];
  b.querySelector(".phase").textContent = s.phase || "waiting";
  b.querySelector(".head").textContent = s.headline || "";
  b.title = s.plan ? "Plan: " + s.plan : "";
}
function show(m) {
  if (m.who === "reset") { convo.innerHTML = ""; nMoves = 0; acts.innerHTML = EMPTY; status({phase: "waiting", headline: "Waiting for a job."}); return; }
  if (m.who === "status") { try { status(JSON.parse(m.text)); } catch (e) {} return; }
  if (m.who === "motion") {
    acts.querySelector(".empty")?.remove();
    const d = document.createElement("div"), stick = atBottom(acts);
    d.className = "a"; d.innerHTML = `<b>${++nMoves}</b>`; d.append(m.text);
    acts.appendChild(d); if (stick) acts.scrollTop = acts.scrollHeight; return;
  }
  const d = document.createElement("div"), stick = atBottom(convo);
  d.className = "m " + m.who;
  d.textContent = (m.who === "hands" ? "✋ " : m.who === "action" ? "⚙ " : "") + m.text;
  convo.appendChild(d); if (stick) convo.scrollTop = convo.scrollHeight;
  if (convo.hidden && m.who === "robot") $("unread").hidden = false;
}
new EventSource("/events").onmessage = e => show(JSON.parse(e.data));
function send() { const t = $("text").value.trim(); if (!t) return; $("text").value = ""; convo.hidden = false; post("/say", {text: t}); }
$("text").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
$("toggle").onclick = () => { convo.hidden = !convo.hidden; $("unread").hidden = true; if (!convo.hidden) convo.scrollTop = convo.scrollHeight; };

// mode, reset, map
let mode = "sim";
function setMode(m) {
  mode = m;
  $("m-sim").classList.toggle("on", m === "sim"); $("m-real").classList.toggle("on", m === "real");
  $("realpanel").hidden = m !== "real"; $("scene").hidden = m !== "sim"; $("add").hidden = m !== "sim";
  $("reset").textContent = m === "sim" ? "Reset" : "Clear";
}
fetch("/config").then(r => r.json()).then(c => { $("viewer").src = c.viewer; setMode(c.mode); });
$("m-sim").onclick = () => { if (mode !== "sim") post("/mode", {mode: "sim"}).then(() => setMode("sim")); };
$("m-real").onclick = () => setMode("real");
$("reset").onclick = () => post("/reset").then(refresh);
$("sort").onclick = () => post("/streams");
$("datarun").onclick = () => post("/datarun");
$("speedtest").onclick = () => post("/speedtest");
$("check").onclick = () => {
  $("check").disabled = true; $("trials").textContent = "checking…";
  post("/real/check", {url: $("url").value, token: $("token").value}).then(r => {
    $("trials").textContent = r.ok === false && r.error ? "couldn't connect" : (r.ready_trial ? `trial ${r.ready_trial} ready` : "connected · waiting for the operator");
    $("run").disabled = !(r.ready_trial || (r.trials || []).some(t => t.status === "running"));
  }).finally(() => { $("check").disabled = false; });
};
$("run").onclick = () => { $("run").disabled = true; post("/real/start"); };

// what's on the table (you looking at it: the true positions)
function cupRow(k, c, n) {
  const r = document.createElement("div"); r.className = "row";
  r.innerHTML = `<select class="k"></select><select class="c"></select><input type="number" class="n" min="0" max="12" value="${n}"><button class="x" title="remove this line">×</button>`;
  opts(r.querySelector(".k"), KINDS, k); opts(r.querySelector(".c"), COLORS, c);
  r.querySelector(".x").onclick = () => r.remove();
  $("cup").appendChild(r);
}
DEFAULT_CUP.forEach(r => cupRow(...r));
$("addrow").onclick = () => cupRow("cube_10", "red", 1);
$("pour").onclick = () => {
  const items = [...$("cup").children].map(r => ({kind: r.querySelector(".k").value, color: r.querySelector(".c").value, count: +r.querySelector(".n").value})).filter(i => i.count > 0);
  $("pour").disabled = true; post("/hands", {action: "pour", items}).finally(() => { $("pour").disabled = false; refresh(); });
};
opts($("boxcolor"), COLORS, "white");
$("addbox").onclick = () => post("/hands", {action: "add_box", color: $("boxcolor").value}).then(refresh);
function refresh() {
  fetch("/objects").then(r => r.json()).then(d => {
    $("state").textContent = `${d.state} · ${Math.round(d.t)} s`;
    if (d.mode === "real" && d.trials) {
      const ready = d.trials.find(t => t.status === "ready"), run = d.trials.find(t => t.status === "running");
      $("trials").textContent = run ? `trial ${run.id} running` : ready ? `trial ${ready.id} ready` : "waiting for the operator";
      $("run").disabled = !(ready || run); $("run").textContent = run && !ready ? "Rejoin the test" : "Run the test";
    }
    $("count").textContent = d.objects.length ? `${d.objects.length} things` : "";
    $("objs").innerHTML = d.objects.length ? "" : '<span style="color:var(--dim);font-size:12px">Nothing yet: add things below.</span>';
    d.objects.sort((a, b) => (b.box - a.box) || a.name.localeCompare(b.name)).forEach(o => {
      const r = document.createElement("div"); r.className = "obj";
      r.innerHTML = `<i class="sw" style="background:${SW[o.color] || "#888"}"></i><span>${o.name.replace("_", " ")} <small>(${o.x}, ${o.y})</small></span>`;
      if (o.box) { const t = document.createElement("button"); t.textContent = "tip out"; t.onclick = () => post("/hands", {action: "tip", id: o.id}).then(refresh); r.appendChild(t); }
      const x = document.createElement("button"); x.textContent = "take"; x.onclick = () => post("/hands", {action: "take", id: o.id}).then(refresh);
      r.appendChild(x); $("objs").appendChild(r);
    });
  }).catch(() => {});
}
refresh(); setInterval(refresh, 3000);
for (const id of ["scene", "add", "ladder"]) {  // remember which panels are folded
  const d = $(id);
  try { const v = localStorage.getItem("fold-" + id); if (v !== null) d.open = v === "1"; } catch (e) {}
  d.addEventListener("toggle", () => { try { localStorage.setItem("fold-" + id, d.open ? "1" : "0"); } catch (e) {} });
}

// the task ladder: each task's state, run one or all, click one to see what it saw and how it ended
const LS = {queued: "queued", running: "running", pass: "PASS", fail: "FAIL", skipped: "skipped"};
let ladder = {tasks: [], results: {}}, shown = null;
function ladderDraw() {
  const box = $("ltasks"); box.innerHTML = "";
  let p = 0, f = 0;
  ladder.tasks.forEach(t => {
    const r = ladder.results[t.name] || {}, st = r.state || "";
    if (st === "pass") p++; if (st === "fail") f++;
    const d = document.createElement("div"); d.className = "lt";
    d.innerHTML = `<i class="chip ${st}">${LS[st] || "—"}</i><span title="${t.instruction}">${t.name.replace(/^ladder\d+_/, "").replace(/_/g, " ")} <small style="color:var(--dim)">${t.instruction}</small></span><button>Run</button>`;
    d.querySelector("span").onclick = () => showTask(t.name);
    d.querySelector("button").onclick = () => post("/ladder/run", {tasks: [t.name]}).then(ladderLoad);
    d.querySelector("button").disabled = !!ladder.running;
    box.appendChild(d);
  });
  $("lsum").textContent = p + f ? `${p} pass · ${f} fail` : "";
  $("lall").disabled = !!ladder.running;
  if (shown) showTask(shown, true);
}
function ladderLoad() { return fetch("/ladder").then(r => r.json()).then(d => { ladder = d; ladderDraw(); }).catch(() => {}); }
function showTask(name, quiet) {
  const r = ladder.results[name], t = ladder.tasks.find(x => x.name === name), el = $("shot");
  if (!r || !r.dir) { if (!quiet) { el.hidden = false; shown = name; el.innerHTML = `<button class="x">Back to the viewer</button><h3>${name}</h3><div class="ins">${t.instruction}</div><p style="color:var(--dim)">${r ? "Running: the pictures appear when it's done." : "Not run yet."}</p>`; el.querySelector(".x").onclick = hideShot; } return; }
  const key = name + r.state + (r.seconds || "");
  if (quiet && el.dataset.key === key) return;
  el.dataset.key = key; shown = name; el.hidden = false;
  const src = f => `/runs/${r.dir}/${f}?${r.seconds || 0}`;
  const llm = r.llm || {};
  el.innerHTML = `<button class="x">Back to the viewer</button>
    <h3><i class="chip ${r.state}" style="font-style:normal">${LS[r.state]}</i> ${name}</h3>
    <div class="ins">“${t.instruction}” · ${r.seconds || "?"} s (scan ${r.scan_s ?? "?"} s, LLM ${r.llm_s ?? "?"} s)</div>
    <div class="pics"><figure><figcaption>Before: what the LLM was shown (numbers = what depth found)</figcaption><img src="${src("before.jpg")}"></figure>
    <figure><figcaption>After</figcaption><img src="${src("after.jpg")}"></figure></div>
    <div class="chk">${(r.checks || []).map(c => `<div>${c.ok ? "✅" : "❌"} ${c.says}</div>`).join("") || (r.why ? `<div>❌ ${r.why}</div>` : "")}</div>
    <pre>LLM sees: ${llm.see || "—"}\nmoves: ${JSON.stringify(llm.moves || [])}\nleave: ${JSON.stringify(llm.leave || [])}\nwhy: ${llm.why || "—"}</pre>`;
  el.querySelector(".x").onclick = hideShot;
}
function hideShot() { $("shot").hidden = true; shown = null; }
$("lall").onclick = () => post("/ladder/run", {}).then(ladderLoad);
$("lstop").onclick = () => post("/ladder/stop").then(ladderLoad);
ladderLoad(); setInterval(ladderLoad, 2000);
</script>
</body>
</html>
